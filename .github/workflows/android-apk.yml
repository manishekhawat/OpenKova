name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kova-${{ github.run_number }}.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kova-apk
          path: kova-${{ github.run_number }}.apk

      - name: Publish as a GitHub release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kova test build ${{ github.run_number }}
          body: |
            Test APK built from ${{ github.sha }}.
            Install on an Android phone (allow "install unknown apps"). Demo OTP: 123456.
          files: kova-${{ github.run_number }}.apk
          prerelease: true
