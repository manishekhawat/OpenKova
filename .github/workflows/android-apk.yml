name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK; just point at it and accept licences.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../gradle.log

      # Surface the compiler errors as a public annotation (job logs need a GitHub login to read).
      - name: Report build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          msg=$( (grep -E "^e: |error:|What went wrong|FAILURE|Exception" -A3 gradle.log || tail -n 40 gradle.log) | head -n 60 )
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$msg"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kova-${{ github.run_number }}.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: kova-apk
          path: kova-${{ github.run_number }}.apk

      - name: Publish as a GitHub release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kova test build ${{ github.run_number }}
          body: |
            Test APK built from ${{ github.sha }}.
            Install on an Android phone (allow "install unknown apps"). Demo OTP: 123456.
          files: kova-${{ github.run_number }}.apk
          prerelease: true
