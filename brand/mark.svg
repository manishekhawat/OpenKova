<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kova mark: note-paper stem, ₹100-lavender arms (the lower one a shade deeper, so the K reads as a fold), ₹200-turmeric coin. -->
  <g transform="translate(-14 0)">
  <!-- stem -->
  <rect x="330" y="262" width="104" height="500" rx="52" fill="#EEE8DC"/>
  <!-- upper arm -->
  <line x1="488" y1="512" x2="664" y2="314" stroke="#B8A8F2" stroke-width="104" stroke-linecap="round"/>
  <!-- lower leg -->
  <line x1="488" y1="512" x2="664" y2="710" stroke="#8C7AE6" stroke-width="104" stroke-linecap="round"/>
  <!-- coin -->
  <circle cx="704" cy="512" r="44" fill="#F0BE4A"/>
  </g>
</svg>
