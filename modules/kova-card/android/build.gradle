plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kovacard'
version = '0.1.0'

android {
  namespace "expo.modules.kovacard"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // On-device text recognition (Latin script). Bundled model: works offline, no Play Services download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
